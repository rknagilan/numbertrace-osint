[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "numbertrace-osint"
version = "0.1.0"
description = "Privacy-respecting unknown-caller investigation: phone metadata, public references and reputation evidence with provenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "NumberTrace OSINT contributors" }]
keywords = ["osint", "phone", "caller-id", "spam", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security",
]
# Base install is deliberately small (pure-Python wheels, works on ARM Chromebooks).
dependencies = [
  "phonenumbers>=9.0,<10",
  "pydantic>=2.9,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<16",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4",
]

[project.scripts]
numbertrace = "numbertrace.cli:main"

[project.urls]
Documentation = "https://github.com/rknagilan/numbertrace-osint/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["numbertrace"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"numbertrace/reporting/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["numbertrace"]

[[tool.mypy.overrides]]
module = ["phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
